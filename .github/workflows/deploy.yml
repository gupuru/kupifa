# サイト → GitHub Pages（docs/ → https://gupuru.github.io/kupifa/）
# DMG  → GitHub Releases（kupifa.dmg）
#
# DMG は毎プッシュでは作らない（macOS runner が重い）。
# タグ v* か、Actions の Run workflow で build_dmg をオンにしたときだけ。

name: Deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      build_dmg:
        description: "Build DMG on macOS and upload to GitHub Releases"
        type: boolean
        default: false

jobs:
  site:
    name: Deploy Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Generate docs/version.json
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          pbxproj = Path('kupifa.xcodeproj/project.pbxproj')
          text = pbxproj.read_text(encoding='utf-8')

          # アプリ本体 (com.kupifa) の MARKETING_VERSION を使う。
          # 先に見つかった MARKETING_VERSION だとテストターゲットを拾うことがある。
          app_versions = re.findall(
              r'MARKETING_VERSION\s*=\s*([^;]+);\s*PRODUCT_BUNDLE_IDENTIFIER\s*=\s*com\.kupifa;',
              text,
          )
          app_versions = [v.strip() for v in app_versions]
          if app_versions:
              version = app_versions[0]
          else:
              m = re.search(r'MARKETING_VERSION\s*=\s*([^;]+);', text)
              version = m.group(1).strip() if m else '0.0'

          out = {
              "version": version,
              "downloadUrl": "https://github.com/gupuru/kupifa/releases/latest/download/kupifa.dmg",
          }
          Path('docs/version.json').write_text(json.dumps(out, ensure_ascii=False, indent=2), encoding='utf-8')
          print("docs/version.json:", out)
          print("app MARKETING_VERSION matches:", app_versions)
          PY

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  dmg:
    name: Build and upload DMG
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      || (github.event_name == 'workflow_dispatch' && inputs.build_dmg)
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Build DMG
        run: ./scripts/build-release.sh

      - name: Resolve release tag
        id: release
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            version=$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('kupifa.xcodeproj/project.pbxproj').read_text(encoding='utf-8')
          app_versions = re.findall(
              r'MARKETING_VERSION\s*=\s*([^;]+);\s*PRODUCT_BUNDLE_IDENTIFIER\s*=\s*com\.kupifa;',
              text,
          )
          if app_versions:
              print(app_versions[0].strip())
          else:
              m = re.search(r'MARKETING_VERSION\s*=\s*([^;]+);', text)
              print(m.group(1).strip() if m else '0.0')
          PY
            )
            echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload DMG to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag }}
          files: dist/kupifa.dmg
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
